<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c2bd9">
  <title>Cosmetics ERP</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #6c2bd9;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      padding: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #666;
    }

    .card p {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
    }

    .button {
      display: block;
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      background: #6c2bd9;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .menu {
      margin-top: 20px;
    }

    .menu button {
      background: white;
      color: #222;
      border: none;
      width: 100%;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      text-align: left;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ Cosmetics & Bangles ERP</h1>
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      <h3>Today's Sales</h3>
      <p>₹0</p>
    </div>

    <div class="card">
      <h3>Today's Profit</h3>
      <p>₹0</p>
    </div>

    <div class="card">
      <h3>Cash</h3>
      <p>₹0</p>
    </div>

    <div class="card">
      <h3>UPI</h3>
      <p>₹0</p>
    </div>

  </div>

  <button class="button">
    ➕ NEW BILL
  </button>

  <button class="button">
    📦 ADD PRODUCT
  </button>

  <div class="menu">

    <button>🧾 Billing</button>
    <button>📦 Products & Stock</button>
    <button>🛒 Purchase</button>
    <button>💰 Payments</button>
    <button>📊 Sales Report</button>
    <button>📈 Profit & Loss</button>

  </div>

</div>

</body>
  </html>
